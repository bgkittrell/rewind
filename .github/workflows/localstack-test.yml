name: LocalStack Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  localstack-tests:
    runs-on: ubuntu-latest
    
    services:
      # Use LocalStack as a service
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          DEBUG: 1
          SERVICES: s3,dynamodb,lambda,sqs,sns,cloudformation,logs,events
          DATA_DIR: /var/lib/localstack/data
          DOCKER_HOST: unix:///var/run/docker.sock
        options: >-
          --health-cmd="curl -f http://localhost:4566/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install localstack awscli boto3 requests pytest
    
    - name: Wait for LocalStack to be ready
      run: |
        echo "Waiting for LocalStack to be ready..."
        for i in {1..30}; do
          if curl -s http://localhost:4566/health > /dev/null; then
            echo "LocalStack is ready!"
            break
          fi
          echo "Attempt $i: LocalStack not ready yet, waiting..."
          sleep 10
        done
        
        # Final health check
        curl -f http://localhost:4566/health || (echo "LocalStack failed to start" && exit 1)
    
    - name: Verify LocalStack services
      run: |
        echo "Checking LocalStack health..."
        curl -s http://localhost:4566/health | jq .
        
        echo "Checking available services..."
        curl -s http://localhost:4566/health | jq '.services'
    
    - name: Configure AWS CLI for LocalStack
      run: |
        aws configure set aws_access_key_id test
        aws configure set aws_secret_access_key test
        aws configure set default.region us-east-1
        aws configure set default.output json
        
        # Test AWS CLI with LocalStack
        aws --endpoint-url=http://localhost:4566 --version
    
    - name: Run LocalStack tests
      run: |
        python -c "
        import sys
        import subprocess
        
        # Create and run the test script inline
        test_script = '''
import boto3
import json
import time
import requests
from botocore.exceptions import ClientError

LOCALSTACK_ENDPOINT = \"http://localhost:4566\"
AWS_REGION = \"us-east-1\"

def create_boto3_client(service_name):
    return boto3.client(
        service_name,
        endpoint_url=LOCALSTACK_ENDPOINT,
        region_name=AWS_REGION,
        aws_access_key_id=\"test\",
        aws_secret_access_key=\"test\"
    )

def test_s3():
    print(\"Testing S3...\")
    s3 = create_boto3_client(\"s3\")
    
    bucket_name = \"test-bucket-gha\"
    s3.create_bucket(Bucket=bucket_name)
    
    s3.put_object(Bucket=bucket_name, Key=\"test.txt\", Body=\"Hello from GHA!\")
    
    response = s3.get_object(Bucket=bucket_name, Key=\"test.txt\")
    content = response[\"Body\"].read().decode(\"utf-8\")
    assert content == \"Hello from GHA!\", f\"Expected content mismatch: {content}\"
    
    s3.delete_object(Bucket=bucket_name, Key=\"test.txt\")
    s3.delete_bucket(Bucket=bucket_name)
    print(\"✓ S3 test passed\")

def test_dynamodb():
    print(\"Testing DynamoDB...\")
    dynamodb = create_boto3_client(\"dynamodb\")
    
    table_name = \"test-table-gha\"
    dynamodb.create_table(
        TableName=table_name,
        KeySchema=[{\"AttributeName\": \"id\", \"KeyType\": \"HASH\"}],
        AttributeDefinitions=[{\"AttributeName\": \"id\", \"AttributeType\": \"S\"}],
        BillingMode=\"PAY_PER_REQUEST\"
    )
    
    # Wait for table
    waiter = dynamodb.get_waiter(\"table_exists\")
    waiter.wait(TableName=table_name)
    
    dynamodb.put_item(
        TableName=table_name,
        Item={\"id\": {\"S\": \"test\"}, \"message\": {\"S\": \"Hello from GHA!\"}}
    )
    
    response = dynamodb.get_item(
        TableName=table_name,
        Key={\"id\": {\"S\": \"test\"}}
    )
    
    assert \"Item\" in response, \"Item not found in DynamoDB\"
    assert response[\"Item\"][\"message\"][\"S\"] == \"Hello from GHA!\", \"Message mismatch\"
    
    dynamodb.delete_table(TableName=table_name)
    print(\"✓ DynamoDB test passed\")

def test_sqs():
    print(\"Testing SQS...\")
    sqs = create_boto3_client(\"sqs\")
    
    queue_name = \"test-queue-gha\"
    response = sqs.create_queue(QueueName=queue_name)
    queue_url = response[\"QueueUrl\"]
    
    sqs.send_message(QueueUrl=queue_url, MessageBody=\"Hello from GHA!\")
    
    response = sqs.receive_message(QueueUrl=queue_url)
    messages = response.get(\"Messages\", [])
    assert len(messages) > 0, \"No messages received\"
    assert messages[0][\"Body\"] == \"Hello from GHA!\", \"Message body mismatch\"
    
    sqs.delete_message(QueueUrl=queue_url, ReceiptHandle=messages[0][\"ReceiptHandle\"])
    sqs.delete_queue(QueueUrl=queue_url)
    print(\"✓ SQS test passed\")

def test_lambda():
    print(\"Testing Lambda...\")
    lambda_client = create_boto3_client(\"lambda\")
    
    function_name = \"test-function-gha\"
    lambda_code = '''
def lambda_handler(event, context):
    return {
        \"statusCode\": 200,
        \"body\": \"Hello from Lambda in GHA!\"
    }
'''
    
    lambda_client.create_function(
        FunctionName=function_name,
        Runtime=\"python3.9\",
        Role=\"arn:aws:iam::123456789012:role/lambda-role\",
        Handler=\"index.lambda_handler\",
        Code={\"ZipFile\": lambda_code.encode()},
        Description=\"Test Lambda function for GHA\"
    )
    
    response = lambda_client.invoke(
        FunctionName=function_name,
        Payload=json.dumps({\"test\": \"data\"})
    )
    
    result = json.loads(response[\"Payload\"].read())
    assert result[\"statusCode\"] == 200, f\"Unexpected status code: {result}\"
    
    lambda_client.delete_function(FunctionName=function_name)
    print(\"✓ Lambda test passed\")

def main():
    print(\"Running LocalStack integration tests...\")
    
    # Wait a bit more for services to be ready
    time.sleep(5)
    
    # Test health endpoint
    response = requests.get(f\"{LOCALSTACK_ENDPOINT}/health\")
    assert response.status_code == 200, f\"Health check failed: {response.status_code}\"
    
    health = response.json()
    print(f\"LocalStack services: {list(health.get('services', {}).keys())}\")
    
    # Run service tests
    test_s3()
    test_dynamodb()
    test_sqs()
    test_lambda()
    
    print(\"All tests passed! 🎉\")

if __name__ == \"__main__\":
    main()
'''
        
        # Write and execute the test
        with open('/tmp/localstack_test.py', 'w') as f:
            f.write(test_script)
        
        result = subprocess.run([sys.executable, '/tmp/localstack_test.py'], 
                               capture_output=True, text=True)
        
        print('STDOUT:')
        print(result.stdout)
        
        if result.stderr:
            print('STDERR:')
            print(result.stderr)
        
        if result.returncode != 0:
            print(f'Test failed with return code: {result.returncode}')
            sys.exit(1)
        
        print('All LocalStack tests completed successfully!')
        "
    
    - name: Test AWS CLI with LocalStack
      run: |
        echo "Testing AWS CLI with LocalStack..."
        
        # Test S3
        aws --endpoint-url=http://localhost:4566 s3 mb s3://cli-test-bucket
        aws --endpoint-url=http://localhost:4566 s3 ls
        echo "Hello from AWS CLI!" | aws --endpoint-url=http://localhost:4566 s3 cp - s3://cli-test-bucket/test.txt
        aws --endpoint-url=http://localhost:4566 s3 cp s3://cli-test-bucket/test.txt -
        aws --endpoint-url=http://localhost:4566 s3 rm s3://cli-test-bucket/test.txt
        aws --endpoint-url=http://localhost:4566 s3 rb s3://cli-test-bucket
        
        # Test DynamoDB
        aws --endpoint-url=http://localhost:4566 dynamodb create-table \
          --table-name cli-test-table \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST
        
        aws --endpoint-url=http://localhost:4566 dynamodb list-tables
        
        aws --endpoint-url=http://localhost:4566 dynamodb put-item \
          --table-name cli-test-table \
          --item '{"id":{"S":"test"},"message":{"S":"Hello from CLI!"}}'
        
        aws --endpoint-url=http://localhost:4566 dynamodb get-item \
          --table-name cli-test-table \
          --key '{"id":{"S":"test"}}'
        
        aws --endpoint-url=http://localhost:4566 dynamodb delete-table --table-name cli-test-table
        
        echo "AWS CLI tests completed successfully!"
    
    - name: Clean up
      if: always()
      run: |
        echo "Cleaning up..."
        # LocalStack container will be automatically cleaned up by GitHub Actions

  localstack-alternative:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install LocalStack
      run: |
        python -m pip install --upgrade pip
        pip install localstack[runtime] awscli boto3 requests
    
    - name: Start LocalStack
      run: |
        # Start LocalStack in background
        localstack start --detached
        
        # Wait for LocalStack to be ready
        echo "Waiting for LocalStack to start..."
        for i in {1..60}; do
          if curl -s http://localhost:4566/health > /dev/null 2>&1; then
            echo "LocalStack is ready!"
            break
          fi
          echo "Attempt $i: Waiting for LocalStack..."
          sleep 5
        done
        
        # Verify LocalStack is running
        curl -f http://localhost:4566/health || (echo "LocalStack failed to start" && exit 1)
        
        # Show LocalStack logs for debugging
        localstack logs | tail -20
      
    - name: Run basic LocalStack test
      run: |
        # Set AWS credentials
        export AWS_ACCESS_KEY_ID=test
        export AWS_SECRET_ACCESS_KEY=test
        export AWS_DEFAULT_REGION=us-east-1
        
        # Test with AWS CLI
        aws --endpoint-url=http://localhost:4566 s3 mb s3://test-bucket-alt
        aws --endpoint-url=http://localhost:4566 s3 ls
        
        echo "Alternative LocalStack setup works!"
    
    - name: Stop LocalStack
      if: always()
      run: |
        localstack stop || true