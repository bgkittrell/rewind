name: Test LocalStack Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start LocalStack
      run: |
        # Start LocalStack in background using Docker
        docker run -d \
          --name localstack \
          -p 4566:4566 \
          -e DEBUG=1 \
          -e SERVICES=s3,dynamodb,lambda,sqs \
          localstack/localstack:latest
        
        # Wait for LocalStack to be ready
        echo "Waiting for LocalStack to start..."
        for i in {1..30}; do
          if curl -s http://localhost:4566/health > /dev/null 2>&1; then
            echo "LocalStack is ready!"
            break
          fi
          echo "Attempt $i: Waiting..."
          sleep 5
        done
        
        # Verify LocalStack is running
        curl -f http://localhost:4566/health || (echo "LocalStack failed to start" && exit 1)
    
    - name: Run LocalStack tests
      run: |
        echo "Running LocalStack tests..."
        python test_localstack_local.py
    
    - name: Test AWS CLI integration
      run: |
        # Configure AWS CLI
        aws configure set aws_access_key_id test
        aws configure set aws_secret_access_key test
        aws configure set default.region us-east-1
        
        # Quick AWS CLI test
        echo "Testing AWS CLI with LocalStack..."
        aws --endpoint-url=http://localhost:4566 s3 mb s3://test-cli-bucket
        aws --endpoint-url=http://localhost:4566 s3 ls
        aws --endpoint-url=http://localhost:4566 s3 rb s3://test-cli-bucket
        
        echo "AWS CLI test completed successfully!"
    
    - name: Show LocalStack status
      if: always()
      run: |
        echo "LocalStack status:"
        curl -s http://localhost:4566/health | jq . || echo "Failed to get health status"
        
        echo "LocalStack logs:"
        docker logs localstack || echo "Failed to get logs"
    
    - name: Cleanup
      if: always()
      run: |
        echo "Stopping LocalStack..."
        docker stop localstack || true
        docker rm localstack || true